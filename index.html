<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retro Walkman Player</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#080909;color:#e9e7df}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 40%,#252727,#080909 75%)}
.player{width:100%;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}
.window{min-height:0;display:flex;align-items:center;justify-content:center}
.cassette{position:relative;container-type:inline-size;width:min(100%,calc((100dvh - 86px)*1.65));aspect-ratio:1.65;flex-shrink:0;overflow:hidden;border:2px solid #4a4a46;border-radius:3.4% / 5.6%;background:repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 3px),linear-gradient(145deg,#343633,#141613 45%,#272925);box-shadow:inset 0 0 0 3px #121410,inset 0 0 0 5px #3c3e38,0 15px 40px #0009}
.cassette:before{content:'';position:absolute;inset:3% 3%;border:1px solid #7774;border-radius:2.5%}
.label{position:absolute;left:6%;right:6%;top:6%;height:76%;border-radius:2% / 3%;background:repeating-linear-gradient(0deg,transparent 0 3px,#77694709 3px 4px),linear-gradient(110deg,#e4ddbf,#f3ebd4 45%,#d9d0b2);color:#282a24;box-shadow:0 0 0 1px #181b15,inset 0 0 12px #8b795332;overflow:hidden}
.label:after{content:'';position:absolute;left:0;right:0;top:27%;height:5%;background:linear-gradient(0deg,#262c29 0 23%,#ded3ae 23% 36%,#9f392a 36% 100%)}
.brand{position:absolute;left:4%;top:5%;font-size:2cqw;font-weight:bold;letter-spacing:.22em}.type{position:absolute;right:4%;top:5%;font-size:1.6cqw;letter-spacing:.12em}
.title{position:absolute;top:13%;left:11%;right:11%;font-family:Georgia,serif;font-style:italic;font-size:3.7cqw;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.artist{position:absolute;top:24%;left:15%;right:15%;font-size:1.6cqw;text-align:center;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;z-index:1}
.side{position:absolute;left:4%;top:38%;font-size:4cqw;font-weight:bold}.length{position:absolute;right:3%;top:39%;font-size:3.8cqw;font-weight:bold;writing-mode:vertical-rl}.fidelity{position:absolute;left:4%;bottom:4%;font-size:1.4cqw;letter-spacing:.14em}
.reelbed{position:absolute;left:14%;right:14%;top:34%;height:40%;border:2px solid #3b3d35;border-radius:13% / 35%;background:linear-gradient(160deg,#ffffff13,#0006 40%,#ffffff05),#191e1b;box-shadow:0 1px 0 #fff5,inset 0 3px 12px #000}
.reelbed:after{content:'';position:absolute;inset:2% 36%;border:1px solid #71695066;background:repeating-linear-gradient(90deg,transparent 0 19%,#c4b88755 19% 20%);border-radius:3px}
.reels{position:absolute;left:15%;right:15%;top:35%;height:40%;display:flex;justify-content:space-between;align-items:center}
.reel{position:relative;width:min(30%,40cqh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#302d24 64%,#111511 66%);box-shadow:0 0 0 1px #b5ad8a77,inset 0 0 8px #000;display:grid;place-items:center}
.pack{position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,#55432e 0 1px,#29251b 1px 2px,#6c5439 2px 3px);transform:scale(var(--pack,1));box-shadow:0 0 0 1px #7e6447;will-change:transform}
.hub{position:relative;width:58%;height:58%;border-radius:50%;background:repeating-conic-gradient(#d6d3be 0 34deg,#373d34 34deg 60deg);border:1.1cqw solid #c9cbbd;box-shadow:0 0 0 1px #ebe9d5,inset 0 0 0 1px #7b7e70,0 3px 5px #000;will-change:transform}
.hub:after{content:'';position:absolute;inset:28%;border-radius:50%;background:#171d17;box-shadow:0 0 0 1px #8e9282}
.tape{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.tape path{fill:none;stroke:#715331;stroke-width:1.5;vector-effect:non-scaling-stroke}
.screw{position:absolute;width:2.6%;aspect-ratio:1;border-radius:50%;background:linear-gradient(130deg,#c3c6ba,#5a6058 50%,#b9bdb0);box-shadow:0 0 0 2px #0c100b,1px 2px 3px #000}.screw:after{content:'';position:absolute;left:18%;right:18%;top:44%;height:12%;background:#343b30;transform:rotate(-30deg)}.s1{left:2.5%;top:4%}.s2{right:2.5%;top:4%}.s3{left:2.5%;bottom:4%}.s4{right:2.5%;bottom:4%}
.bottomslot{position:absolute;left:23%;right:23%;bottom:0;height:15%;background:repeating-linear-gradient(0deg,#30352c 0 1px,#22271f 1px 3px);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);box-shadow:inset 0 2px 2px #ffffff24}
.holes{position:absolute;left:30%;right:30%;bottom:3.5%;height:5%;display:flex;justify-content:space-between;align-items:center}.holes i{width:5%;aspect-ratio:1;border-radius:50%;background:#040704;box-shadow:0 1px 0 #7778}.holes i:nth-child(2){width:17%;aspect-ratio:2.8;border-radius:2px}
.meta{position:absolute;left:21%;right:21%;bottom:20%;display:flex;justify-content:space-between;color:#c7c6b3;font:1.7cqw monospace;z-index:2}
.progress{position:absolute;left:19%;width:62%;bottom:14%;height:24px;margin:0;accent-color:#bcb69b;z-index:3;background:transparent;cursor:pointer}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:center;min-height:48px}
.controls{display:flex;gap:6px}button{min-width:48px;min-height:44px;border:1px solid #53574b;border-radius:7px;background:linear-gradient(#363b31,#1b2018);color:#e2dfcc;box-shadow:inset 0 1px 0 #ffffff14,0 2px 2px #000;font-size:18px;touch-action:manipulation;cursor:pointer}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:2px solid #eee2bc;outline-offset:3px}#play{min-width:66px}
.load{font-size:11px;letter-spacing:.12em;padding:0 16px}.volumeRow{display:flex;align-items:center;gap:7px;color:#9fa38f;font-size:10px;letter-spacing:.1em}.volumeRow input{width:90px;accent-color:#c5bea0}.note{position:absolute;left:0;right:0;top:10%;text-align:center;color:#a7a58f;font-size:12px;letter-spacing:.16em;pointer-events:none}.note span{display:block;font-size:10px;letter-spacing:0;margin-top:8px}input[type=file]{display:none}
/* Fit the cassette without stretching; keep transport controls beside it. */
.window{min-width:0;container-type:size}
.cassette{width:min(100cqw,165cqh);background:repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 3px),linear-gradient(145deg,#34373a,#141618 45%,#272a2d)}
.label{background:repeating-linear-gradient(0deg,transparent 0 3px,#45494d09 3px 4px),linear-gradient(110deg,#b9bdc0,#eceeef 45%,#a9aeb2);color:#24272a;box-shadow:0 0 0 1px #181b15,inset 0 0 12px #45494d32}
.label:after{background:linear-gradient(0deg,#262c29 0 23%,#dce0e3 23% 36%,#616970 36% 100%)}
.title{font-family:Arial,Helvetica,sans-serif;font-style:normal;font-weight:600}
.artist{top:22.5%}
.meta{color:#e0e3e5}
.progress,.volumeRow input{accent-color:#c4cbd0}
button{border-color:#565d63;background:linear-gradient(#383d42,#191c1f);color:#edf0f2}
button:focus-visible,input:focus-visible{outline-color:#e0e8ee}
.volumeRow{color:#b6bfc5}
@media(orientation:landscape){
  .player{grid-template-columns:minmax(0,1fr) clamp(112px,16vw,152px);grid-template-rows:minmax(0,1fr);gap:12px}
  .note{display:none}
  .toolbar{min-width:0;flex-direction:column;gap:12px}
  .controls{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  #play{grid-column:1 / -1;grid-row:1;min-height:48px}
  .load{width:100%;padding:0 6px}
  .volumeRow{flex-direction:column;gap:4px}
}
@media(orientation:portrait){.player{gap:18px;padding-bottom:max(24px,env(safe-area-inset-bottom))}.cassette{width:100%}.toolbar{flex-wrap:wrap}.volumeRow{display:none}.progress{height:20px;bottom:12%}.note{top:12%}}
@media(max-height:340px) and (orientation:landscape){.player{gap:8px}.toolbar{gap:6px}.volumeRow{display:none}}
</style>
</head>
<body>
<main class="player" id="player">
  <div class="note">TURN YOUR PHONE SIDEWAYS<span>Load your music and press play</span></div>
  <section class="window" aria-label="Vintage cassette player">
    <div class="cassette">
      <div class="label">
        <span class="brand">RETRO SOUND</span><span class="type">NORMAL POSITION · TYPE I</span>
        <div class="title" id="title">Your favourite mixtape</div>
        <div class="artist" id="artist">SELECT MUSIC TO BEGIN</div>
        <span class="side">A</span><span class="length">C·90</span><span class="fidelity">LOW NOISE · HIGH OUTPUT</span>
      </div>
      <div class="reelbed"></div>
      <svg class="tape" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="tapePath" d=""/></svg>
      <div class="reels" aria-hidden="true"><div class="reel"><div class="pack"></div><div class="hub"></div></div><div class="reel"><div class="pack"></div><div class="hub"></div></div></div>
      <div class="bottomslot"></div><div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>
      <i class="screw s1" aria-hidden="true"></i><i class="screw s2" aria-hidden="true"></i><i class="screw s3" aria-hidden="true"></i><i class="screw s4" aria-hidden="true"></i>
      <div class="meta"><span id="elapsed">00:00</span><span id="trackNo">NO TAPE</span><span id="duration">00:00</span></div>
      <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="Playback position">
    </div>
  </section>
  <div class="toolbar">
    <div class="controls">
      <button id="prev" aria-label="Previous track">◀◀</button><button id="play" aria-label="Play or pause">▶</button><button id="next" aria-label="Next track">▶▶</button>
    </div>
    <button class="load" id="load">LOAD MUSIC</button>
    <div class="volumeRow"><label for="volume">VOL</label><input id="volume" type="range" min="0" max="1" value=".8" step=".01"></div>
    <button id="fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button>
  </div>
  <input id="files" type="file" accept="audio/*" multiple><audio id="audio"></audio>
</main>

<script>
const audio=document.getElementById('audio'), files=document.getElementById('files');
const load=document.getElementById('load'), play=document.getElementById('play');
const prev=document.getElementById('prev'), next=document.getElementById('next');
const title=document.getElementById('title'), artist=document.getElementById('artist');
const elapsed=document.getElementById('elapsed'), duration=document.getElementById('duration');
const progress=document.getElementById('progress'), volume=document.getElementById('volume');
const trackNo=document.getElementById('trackNo'), player=document.getElementById('player');
let list=[], index=0, urls=[];

// Tape area is proportional to radius squared. Both reels share a constant
// tape speed, so the smaller reel naturally turns faster.
const packs=[...document.querySelectorAll('.pack')];
const hubs=[...document.querySelectorAll('.hub')];
const tapePath=document.getElementById('tapePath');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let frame=0, lastFrame=null, angles=[0,0], radii=[1,.66];
let tapeGeometry=[25.5,74.5,55,55,15.94,15.94];
const cassette=document.querySelector('.cassette');
function measureTape(){
  const box=cassette.getBoundingClientRect();
  if(!box.width||!box.height)return;
  const reels=[...document.querySelectorAll('.reel')].map(reel=>reel.getBoundingClientRect());
  tapeGeometry=[...reels.map(r=>(r.left+r.width/2-box.left)/box.width*100),
    ...reels.map(r=>(r.top+r.height/2-box.top)/box.height*100),
    ...reels.map(r=>r.height*.46/box.height*100)];
  drawTape(tapePosition());
}
window.addEventListener('resize',measureTape);
if('ResizeObserver' in window)new ResizeObserver(measureTape).observe(cassette);
function drawTape(fraction){
  const p=Math.min(1,Math.max(0,fraction));
  const core=.66, area=1-core*core;
  radii=[Math.sqrt(core*core+(1-p)*area),Math.sqrt(core*core+p*area)];
  packs.forEach((pack,i)=>pack.style.setProperty('--pack',radii[i]));
  // Coordinates match the responsive reel centres and tape-pack radii.
  const [leftX,rightX,leftCentre,rightCentre,leftRadius,rightRadius]=tapeGeometry;
  const leftY=leftCentre+leftRadius*radii[0], rightY=rightCentre+rightRadius*radii[1];
  tapePath.setAttribute('d',`M ${leftX} ${leftY} L 38 91 L 62 91 L ${rightX} ${rightY}`);
}
function tapePosition(){
  return Number.isFinite(audio.duration)&&audio.duration>0?audio.currentTime/audio.duration:0;
}
function animateTape(now){
  frame=0;
  const dt=lastFrame===null?0:Math.min((now-lastFrame)/1000,.1);
  lastFrame=now;
  drawTape(tapePosition());
  if(!reducedMotion.matches){
    hubs.forEach((hub,i)=>{
      angles[i]=(angles[i]+dt*200/radii[i])%360;
      hub.style.transform=`rotate(${angles[i]}deg)`;
    });
  }
  if(!audio.paused&&!audio.ended)frame=requestAnimationFrame(animateTape);
}
function stopTape(){cancelAnimationFrame(frame);frame=0;lastFrame=null}
function startTape(){if(!frame){lastFrame=null;frame=requestAnimationFrame(animateTape)}}
audio.addEventListener('playing',startTape);
['pause','waiting','ended','emptied'].forEach(event=>audio.addEventListener(event,stopTape));
audio.addEventListener('seeked',()=>drawTape(tapePosition()));
document.addEventListener('visibilitychange',()=>{lastFrame=null});
drawTape(0);measureTape();

const fmt=s=>{if(!isFinite(s))return '00:00'; s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();

load.onclick=()=>files.click();
files.onchange=()=>{
  const selected=[...files.files]; if(!selected.length)return;
  audio.pause();
  urls.forEach(URL.revokeObjectURL); urls=[];
  list=selected;
  urls=list.map(f=>URL.createObjectURL(f)); index=0; setTrack(false);
};
function setTrack(auto=true){
  if(!list.length)return;
  audio.src=urls[index];
  stopTape();drawTape(0);
  let name=clean(list[index].name), parts=name.split(/\s+-\s+/);
  if(parts.length>1){artist.textContent=parts.shift();title.textContent=parts.join(' - ')}
  else {title.textContent=name;artist.textContent='PHONE AUDIO'}
  trackNo.textContent=(index+1)+' / '+list.length;
  progress.value=0; elapsed.textContent='00:00'; duration.textContent='00:00';
  if(auto) audio.play().catch(()=>{});
}
play.onclick=()=>{if(!list.length){files.click();return} audio.paused?audio.play():audio.pause()};
prev.onclick=()=>{if(!list.length)return; index=(index-1+list.length)%list.length;setTrack()};
next.onclick=()=>{if(!list.length)return; index=(index+1)%list.length;setTrack()};
audio.onplay=()=>{play.textContent='❚❚';player.classList.add('playing')};
audio.onpause=()=>{play.textContent='▶';player.classList.remove('playing')};
audio.onloadedmetadata=()=>{duration.textContent=fmt(audio.duration);drawTape(tapePosition())};
audio.ontimeupdate=()=>{
  elapsed.textContent=fmt(audio.currentTime);
  drawTape(tapePosition());
  if(audio.duration)progress.value=Math.round(audio.currentTime/audio.duration*1000);
};
audio.onended=()=>{index=(index+1)%list.length;setTrack()};
progress.oninput=()=>{if(audio.duration)audio.currentTime=progress.value/1000*audio.duration};
const fullScreen=document.getElementById('fullscreen');
if(!document.fullscreenEnabled)fullScreen.hidden=true;
fullScreen.onclick=async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();}catch{}
};
document.addEventListener('fullscreenchange',()=>{
  const active=!!document.fullscreenElement;
  fullScreen.setAttribute('aria-label',active?'Exit full screen':'Enter full screen');
  fullScreen.title=active?'Exit full screen':'Full screen';
});
volume.oninput=()=>audio.volume=volume.value;
audio.volume=volume.value;

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
